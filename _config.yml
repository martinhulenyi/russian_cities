title: Transactions over £25,000 in the Foreign and Commonwealth Office
description:Data contains spatial information on Russian cities. We obtained the list of the cities contained in the spatial file from the Wikipedia list of Russian cities (https://archive.ph/IjKhf) and used them to scrape  the spatial data from OpenStreetMaps using the nominatimlite R package (OSM data scraped via the nominatimlite R package, approximately Q3–Q4 2023 - exact date and package version not recorded). We do not include in our analysis the illegally occupied Crimea and Sebastopol, which Russia has been claiming as its 84th and 85th subjects since 2014, or the four regions of Ukraine that is attempted to annex in 2022. In a small number of cases, we added the term “gorod” (city) to avoid retrieving the boundaries of higher-level administrative units rather than city-level geometries (Khabarovsk, Irkutsk, Magadan, Tomsk, Vologda, Stavropol, Lipetsk, and Onega.). Finally, for cities sharing the same name but located in different regions, we replaced “Russia” with the name of the corresponding federal subject in the query (Beryozovsky, Blagoveshchensk, Fokino, Guryevsk, Kirov, Kirovsk, Krasnoarmeysk, Krasnoslobodsk, Krasnoznamensk, Mikhaylovsk, Mirny, Nikolsk, Ozyorsk, Pavlovsk, Raduzhny, Sovetsk, Troitsk, Zarechny, Zelenogorsk, and Zheleznogorsk). 

